<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .bar{background:var(--codis-orange);border-radius:3px;}
  .lbl{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono);}
  .num{font-size:11px;font-weight:600;color:var(--fg);}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="num">4</div><div class="lbl">--space-1</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="num">8</div><div class="lbl">--space-2</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="num">12</div><div class="lbl">--space-3</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="num">16</div><div class="lbl">--space-4</div></div>
    <div class="item"><div class="bar" style="width:20px;height:20px"></div><div class="num">20</div><div class="lbl">--space-5</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="num">24</div><div class="lbl">--space-6</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="num">32</div><div class="lbl">--space-8</div></div>
    <div class="item"><div class="bar" style="width:40px;height:40px"></div><div class="num">40</div><div class="lbl">--space-10</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="num">48</div><div class="lbl">--space-12</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="num">64</div><div class="lbl">--space-16</div></div>
  </div>
</body></html>
