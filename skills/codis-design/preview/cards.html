<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg-muted);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:none;}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;}
  .title{font-weight:500;font-size:14.5px;color:var(--fg);letter-spacing:-0.005em;}
  .sub{font-size:11.5px;color:var(--fg-subtle);font-family:var(--font-mono);margin-top:3px;letter-spacing:0;}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:#EAF1E8;color:#4F8E5A;}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:#4F8E5A;}
  .stats{display:flex;gap:28px;}
  .stat{font-size:11px;color:var(--fg-subtle);font-weight:400;}
  .stat b{display:block;font-size:17px;color:var(--fg);font-weight:400;margin-top:3px;font-family:var(--font-display);letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
</style></head>
<body>
<div class="grid">
  <div class="card">
    <div class="head">
      <div><div class="title">Базова станція №142</div><div class="sub">SKU-1284 · Львів</div></div>
      <span class="badge"><span class="dot"></span>Active</span>
    </div>
    <div class="stats"><div class="stat">Open WO<b>3</b></div><div class="stat">Last service<b>14 d ago</b></div><div class="stat">Uptime<b>99.2%</b></div></div>
  </div>
  <div class="card">
    <div class="head">
      <div><div class="title">Tower 7B</div><div class="sub">SKU-0931 · Kyiv</div></div>
      <span class="badge" style="background:#F4E9D4;color:#946720"><span class="dot" style="background:#C68A3D"></span>Due</span>
    </div>
    <div class="stats"><div class="stat">Open WO<b>1</b></div><div class="stat">Last service<b>62 d ago</b></div><div class="stat">Uptime<b>97.4%</b></div></div>
  </div>
</div>
</body></html>
