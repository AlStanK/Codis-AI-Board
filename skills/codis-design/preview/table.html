<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-weight:600;color:var(--fg-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--divider);}
  tr:hover td{background:var(--gray-50);}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px;color:var(--fg);}
  .id{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);}
  .b{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .b-on{background:#DCFCE7;color:#15803D;} .b-warn{background:#FEF3C7;color:#92400E;} .b-off{background:#FEE2E2;color:#B91C1C;}
</style></head>
<body>
<table>
  <thead><tr><th>Asset</th><th>ID</th><th>Status</th><th class="num">Open WO</th><th class="num">Uptime</th></tr></thead>
  <tbody>
    <tr><td>Базова станція №142</td><td class="id">SKU-1284</td><td><span class="b b-on">Active</span></td><td class="num">3</td><td class="num">99.2%</td></tr>
    <tr><td>Tower 7B</td><td class="id">SKU-0931</td><td><span class="b b-warn">Due</span></td><td class="num">1</td><td class="num">97.4%</td></tr>
    <tr><td>Будівля Ратуша</td><td class="id">SKU-2204</td><td><span class="b b-on">Active</span></td><td class="num">0</td><td class="num">100%</td></tr>
    <tr><td>Substation E-12</td><td class="id">SKU-1077</td><td><span class="b b-off">Offline</span></td><td class="num">5</td><td class="num">82.1%</td></tr>
  </tbody>
</table>
</body></html>
