<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>

  .h2{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--fg);}
</style></head>
<body>
<div class="stack">
  <div><div class="label">Display · e-Ukraine Head 700 · 56/1.05</div><div class="display">Підвищуємо ефективність</div></div>
  <div><div class="label">H1 · e-Ukraine Head 700 · 40/1.15</div><div class="h1">Asset Passport · Цифровий паспорт</div></div>
  <div><div class="label">H2 · e-Ukraine Head 600 · 32/1.3</div><div class="h2">Service requests</div></div>
