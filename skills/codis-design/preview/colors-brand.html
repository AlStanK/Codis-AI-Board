<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);padding:20px;}
  .row{display:flex;gap:14px;align-items:stretch;}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;}
  .chip{height:78px;}
  .meta{padding:10px 12px;background:var(--surface);}
  .name{font-size:13px;font-weight:600;color:var(--fg);}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#E76033"></div><div class="meta"><div class="name">Orange · primary</div><div class="hex">#E76033</div></div></div>
    <div class="sw"><div class="chip" style="background:#1A1A1A"></div><div class="meta"><div class="name">Black · neutral</div><div class="hex">#1A1A1A</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--border);"></div><div class="meta"><div class="name">White · base</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:#71717A"></div><div class="meta"><div class="name">Grey · secondary</div><div class="hex">#71717A</div></div></div>
    <div class="sw"><div class="chip" style="background:#7828C8"></div><div class="meta"><div class="name">Purple · accent</div><div class="hex">#7828C8</div></div></div>
  </div>
</body></html>
