<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:var(--font-sans);font-weight:500;font-size:14px;border-radius:10px;padding:10px 18px;border:1px solid transparent;cursor:pointer;transition:all 200ms cubic-bezier(.2,.7,.2,1);display:inline-flex;align-items:center;gap:8px;}
  .primary{background:var(--codis-orange);color:#fff;}
  .primary:hover{background:#D14E22;box-shadow:var(--shadow-orange);}
  .secondary{background:var(--surface);color:var(--fg);border-color:var(--border);}
  .secondary:hover{background:var(--gray-50);border-color:var(--border-strong);}
  .ghost{background:transparent;color:var(--fg);}
  .ghost:hover{background:var(--gray-100);}
  .danger{background:#fff;color:var(--danger);border-color:#FCA5A5;}
  .danger:hover{background:var(--danger-bg);}
  .dark{background:var(--codis-black);color:#fff;}
  .dark:hover{background:#000;}
  .pill{border-radius:999px;}
  .lg{font-size:16px;padding:14px 24px;}
  .sm{font-size:13px;padding:7px 14px;}
  .label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);width:100%;margin-top:8px;}
</style></head>
<body>
  <div class="label">Sizes · primary</div>
  <div class="row">
    <button class="btn primary lg">Add asset</button>
    <button class="btn primary">Add asset</button>
    <button class="btn primary sm">Add</button>
    <button class="btn primary pill">Get started</button>
  </div>
  <div class="label">Variants</div>
  <div class="row">
    <button class="btn primary">Save changes</button>
    <button class="btn secondary">Cancel</button>
    <button class="btn ghost">Skip</button>
    <button class="btn danger">Delete asset</button>
    <button class="btn dark">Open passport</button>
  </div>
</body></html>
