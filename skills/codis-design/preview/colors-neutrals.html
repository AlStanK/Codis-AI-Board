<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);padding:20px;}
  .row{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
  .sw{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);}
  .chip{height:54px;}
  .meta{padding:6px 8px;background:var(--surface);text-align:center;}
  .name{font-size:11px;font-weight:600;}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);margin-top:2px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FAFAFA;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">50</div><div class="hex">FAFAFA</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4F4F5"></div><div class="meta"><div class="name">100</div><div class="hex">F4F4F5</div></div></div>
    <div class="sw"><div class="chip" style="background:#E4E4E7"></div><div class="meta"><div class="name">200</div><div class="hex">E4E4E7</div></div></div>
    <div class="sw"><div class="chip" style="background:#D4D4D8"></div><div class="meta"><div class="name">300</div><div class="hex">D4D4D8</div></div></div>
    <div class="sw"><div class="chip" style="background:#A1A1AA"></div><div class="meta"><div class="name">400</div><div class="hex">A1A1AA</div></div></div>
    <div class="sw"><div class="chip" style="background:#71717A"></div><div class="meta"><div class="name">500</div><div class="hex">71717A</div></div></div>
    <div class="sw"><div class="chip" style="background:#52525B"></div><div class="meta"><div class="name">600</div><div class="hex">52525B</div></div></div>
    <div class="sw"><div class="chip" style="background:#3F3F46"></div><div class="meta"><div class="name">700</div><div class="hex">3F3F46</div></div></div>
    <div class="sw"><div class="chip" style="background:#27272A"></div><div class="meta"><div class="name">800</div><div class="hex">27272A</div></div></div>
    <div class="sw"><div class="chip" style="background:#18181B"></div><div class="meta"><div class="name">900</div><div class="hex">18181B</div></div></div>
  </div>
</body></html>
