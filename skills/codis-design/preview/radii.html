<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:64px;height:64px;background:var(--codis-orange);}
  .lbl{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono);}
  .num{font-size:11px;font-weight:600;color:var(--fg);}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="num">4 px</div><div class="lbl">--radius-xs</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="num">6 px</div><div class="lbl">--radius-sm</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="num">10 px</div><div class="lbl">--radius-md</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="num">14 px</div><div class="lbl">--radius-lg</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="num">20 px</div><div class="lbl">--radius-xl</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="num">full</div><div class="lbl">--radius-full</div></div>
    <div class="item"><div class="box" style="border-radius:30%"></div><div class="num">squircle</div><div class="lbl">favicon shape</div></div>
  </div>
</body></html>
