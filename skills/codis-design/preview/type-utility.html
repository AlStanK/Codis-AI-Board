<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-subtle);margin-bottom:10px;}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
  .mono{font-family:var(--font-mono);font-size:14px;background:var(--bg-subtle);padding:6px 10px;border-radius:6px;}
  .weights{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;}
  .weights span{font-family:var(--font-sans);font-size:24px;color:var(--fg);}
</style></head>
<body>
  <div class="label">Eyebrow + Mono</div>
  <div class="row" style="margin-bottom:24px;">
    <span class="eyebrow">FOR ASSET MANAGERS</span>
    <span class="mono">--codis-orange</span>
    <span class="mono">welcome@codislab.com</span>
  </div>
  <div class="label">Weight ladder · e-Ukraine</div>
  <div class="weights">
    <span style="font-weight:200">Codis 200</span>
    <span style="font-weight:300">Codis 300</span>
    <span style="font-weight:400">Codis 400</span>
    <span style="font-weight:500">Codis 500</span>
    <span style="font-weight:600">Codis 600</span>
    <span style="font-weight:700">Codis 700</span>
  </div>
</body></html>
