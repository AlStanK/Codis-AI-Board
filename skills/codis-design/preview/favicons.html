<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);padding:24px;color:var(--fg);}
  .row{display:flex;gap:32px;align-items:center;}
  .ico{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .ico img{display:block;}
  .lbl{font-size:11px;font-family:var(--font-mono);color:var(--fg-muted);}
  .num{font-size:11px;font-weight:600;}
</style></head>
<body>
  <div class="row">
    <div class="ico"><img src="../assets/favicon-16.png" width="16" height="16"/><div class="num">16</div><div class="lbl">browser tab</div></div>
    <div class="ico"><img src="../assets/favicon-32.png" width="32" height="32"/><div class="num">32</div><div class="lbl">desktop</div></div>
    <div class="ico"><img src="../assets/favicon-180.png" width="64" height="64" style="border-radius:14px"/><div class="num">64</div><div class="lbl">app icon</div></div>
    <div class="ico"><img src="../assets/favicon-180.png" width="96" height="96" style="border-radius:22px"/><div class="num">96</div><div class="lbl">touch</div></div>
    <div class="ico"><img src="../assets/favicon-180.png" width="120" height="120" style="border-radius:28px"/><div class="num">120</div><div class="lbl">marketing</div></div>
  </div>
</body></html>
